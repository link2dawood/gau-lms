# Local development overrides.
#
# Docker Compose loads this file automatically alongside docker-compose.yml, so
# `docker compose up` gives a developer the Next.js dev server with fast refresh
# while the base file stays production-shaped.
#
# CI and any faithful run must bypass it explicitly:
#
#     docker compose -f docker-compose.yml up -d --wait
#
# This exists because the dev server compiles routes on first request — a cold
# /_not-found took 29 seconds — which is not a timing the deployed platform ever
# has, and which made the end-to-end suite flaky. See DECISIONS.md D-021.

services:
  frontend:
    build:
      target: dev
    image: gau-textbook-frontend:dev
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    command: npm run dev

volumes:
  frontend_next_cache:

# GAU Interactive Textbook Platform — local and staging stack.
#
# Eight services: three backing stores, two application images (the backend
# image is reused for the web process and both Celery processes), and Nginx as
# the single entry point.
#
#   nginx  ──┬──▶ backend  (Gunicorn, Django)   /api /lti /admin /static /media
#            └──▶ frontend (Next.js)            everything else
#   backend, celery_worker, celery_beat ──▶ postgres, redis, meilisearch
#
# Backing stores bind to 127.0.0.1 only, so they are reachable from the host for
# psql/redis-cli during development but never exposed to the network. Inside the
# stack they are reached by service name on the private `gau_net` bridge.
#
# Production deployment (TLS, tuned Gunicorn, process supervision, backups) is
# task 4.8 and adds an override file rather than editing this one.

name: gau-textbook

x-backend-image: &backend-image
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
    target: dev
  image: gau-textbook-backend:dev
  env_file: [.env]
  volumes:
    - ./backend:/app
    - static_files:/app/staticfiles
    - media_files:/app/media
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    meilisearch: {condition: service_healthy}
  restart: unless-stopped
  networks: [gau_net]

services:
  # ---------------------------------------------------------------- datastores
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gau_textbook}
      POSTGRES_USER: ${POSTGRES_USER:-gau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic collation so ordering of content titles does not shift
      # between the developer machine and the server.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gau} -d ${POSTGRES_DB:-gau_textbook}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [gau_net]

  redis:
    # Pinned to 7.2, the last BSD-3 licensed Redis line. See DECISIONS.md D-006.
    image: redis:7.2-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save ""
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [gau_net]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data
    volumes:
      - meili_data:/meili_data
    ports:
      - "127.0.0.1:${MEILI_HOST_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "meilisearch", "--help"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [gau_net]

  # -------------------------------------------------------------- application
  backend:
    <<: *backend-image
    # Gunicorn in every environment, with --reload locally, so the process that
    # serves development is the process that serves production.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers ${GUNICORN_WORKERS:-2}
               --timeout ${GUNICORN_TIMEOUT:-60}
               --access-logfile - --error-logfile -
               --reload"
    expose: ["8000"]

  celery_worker:
    <<: *backend-image
    # Imports, search indexing and roster sync. Never inline in a request.
    command: celery -A config.celery worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-2}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
      backend: {condition: service_started}

  celery_beat:
    <<: *backend-image
    # Scheduled work: NRPS roster synchronisation (task 1.13).
    command: celery -A config.celery beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_started}

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    image: gau-textbook-frontend:dev
    env_file: [.env]
    environment:
      # Server-side calls go over the private network; browser calls go through
      # Nginx on the public origin.
      INTERNAL_API_BASE_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    command: npm run dev
    expose: ["3000"]
    restart: unless-stopped
    networks: [gau_net]

  # ------------------------------------------------------------------- edge
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend: {condition: service_started}
      frontend: {condition: service_started}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [gau_net]

volumes:
  pg_data:
  redis_data:
  meili_data:
  static_files:
  media_files:
  frontend_node_modules:
  frontend_next_cache:

networks:
  gau_net:
    driver: bridge

# Nginx entry point for the GAU Interactive Textbook Platform.
# Server blocks live in conf.d/. TLS termination is added in task 4.8.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Textbook sections and search responses are long-form text; compression is
    # the single largest win for first paint.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/x-javascript image/svg+xml;

    # Imported source documents (Word, EPUB, PDF) are the largest uploads the
    # platform accepts. Kept in step with the backend upload limit.
    client_max_body_size 64m;

    # Canvas launches arrive over HTTPS terminated upstream. Django needs the
    # original scheme to build correct absolute URLs and to enforce secure
    # cookies, so it is forwarded on every proxied request.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    # Websocket upgrade passthrough for the Next.js dev server's fast refresh.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}

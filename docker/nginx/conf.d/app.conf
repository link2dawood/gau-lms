upstream backend_app {
    server backend:8000;
    keepalive 16;
}

upstream frontend_app {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Backend -----------------------------------------------------------
    # Django owns the API, the LTI endpoints and the Django admin. Everything
    # else belongs to Next.js.

    location /api/ {
        include /etc/nginx/proxy_params;
        proxy_set_header Connection "";
        proxy_pass http://backend_app;
    }

    # OIDC login initiation, launch, JWKS and deep linking.
    # Rate limiting is added in task 4.4.
    location /lti/ {
        include /etc/nginx/proxy_params;
        proxy_set_header Connection "";
        proxy_pass http://backend_app;
    }

    location /admin/ {
        include /etc/nginx/proxy_params;
        proxy_set_header Connection "";
        proxy_pass http://backend_app;
    }

    # Django's collected static files, served directly rather than through the
    # application process.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Figures and illustrations uploaded through the CMS.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Frontend ----------------------------------------------------------

    # Next.js build assets are content-hashed and safe to cache indefinitely.
    location /_next/static/ {
        include /etc/nginx/proxy_params;
        proxy_set_header Connection "";
        proxy_pass http://frontend_app;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js dev server fast refresh runs over a websocket.
    location /_next/webpack-hmr {
        include /etc/nginx/proxy_params;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://frontend_app;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://frontend_app;
    }
}
